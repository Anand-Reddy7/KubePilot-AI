apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-app
  namespace: ai-agent-lab

spec:
  replicas: 1

  selector:
    matchLabels:
      app: nginx-app

  template:
    metadata:
      labels:
        app: nginx-app

    spec:
      containers:
        - name: nginx-app
          image: nginx:this-tag-does-not-exist
