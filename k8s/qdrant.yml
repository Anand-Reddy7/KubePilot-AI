apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:latest
          ports:
            - containerPort: 6333
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: dev
spec:
  selector:
    app: qdrant
  ports:
    - name: http
      port: 6333
      targetPort: 6333

# curl http://localhost:6333/collections (List Out the collections)
# curl -X DELETE http://localhost:6333/collections/kubernetes_runbooks (Delete existing data in database)